spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false   # LocalDateTime → "2026-06-13T12:30:00" 문자열

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moim}
    username: ${DB_USER:moim}
    password: ${DB_PASSWORD:moim}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 개발: update (테이블 없으면 자동 생성, 있으면 컬럼만 추가)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          naver:
            client-id: ${NAVER_LOGIN_CLIENT_ID}
            client-secret: ${NAVER_LOGIN_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope: name, email, profile_image
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: ${JWT_SECRET}          # 최소 32자 이상 (256비트) 필수
  access-expiry: 3600            # 1시간 (초)
  refresh-expiry: 1209600        # 14일 (초)

naver:
  directions:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: https://maps.apigw.ntruss.com
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET}

app:
  front-url: ${FRONT_URL:http://localhost:3000}

server:
  port: 8000
