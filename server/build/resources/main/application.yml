spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moim}
    username: ${DB_USER:moim}
    password: ${DB_PASSWORD:moim}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 개발: update (테이블 없으면 자동 생성, 있으면 컬럼만 추가)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}          # 최소 32자 이상 (256비트) 필수
  access-expiry: 3600            # 1시간 (초)
  refresh-expiry: 1209600        # 14일 (초)

naver:
  directions:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    base-url: https://naveropenapi.apigw.ntruss.com

app:
  front-url: ${FRONT_URL:http://localhost:5173}

server:
  port: 8000
